<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Super Multi-Fitur</title>
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-calc: #ffffff;
            --txt-main: #333333;
            --btn-num: #e9ecef;
            --btn-op: #fd7e14;
            --btn-sci: #6c757d;
            --screen-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-calc: #1e1e1e;
            --txt-main: #ffffff;
            --btn-num: #2d2d2d;
            --btn-op: #f77f00;
            --btn-sci: #4a4a4a;
            --screen-bg: #0f0f0f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--txt-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .calculator {
            background-color: var(--bg-calc);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--txt-main);
            color: var(--txt-main);
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .screen {
            background-color: var(--screen-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .screen .history {
            font-size: 0.9rem;
            color: #888;
            min-height: 20px;
            overflow: hidden;
        }

        .screen .result {
            font-size: 2rem;
            font-weight: bold;
            overflow-x: auto;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, filter 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .num { background-color: var(--btn-num); color: var(--txt-main); }
        .op { background-color: var(--btn-op); color: white; }
        .sci { background-color: var(--btn-sci); color: white; }
        .clear { background-color: #dc3545; color: white; }

        .history-panel {
            background-color: var(--bg-calc);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 250px;
            max-height: 450px;
            overflow-y: auto;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            text-align: right;
        }

        .history-item:hover {
            background-color: var(--screen-bg);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calculator">
        <div class="header">
            <h3>Kalkulator Pro</h3>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
        </div>
        <div class="screen">
            <div class="history" id="display-history"></div>
            <div class="result" id="display-result">0</div>
        </div>
        <div class="buttons">
            <button class="sci" onclick="pressSci('sin')">sin</button>
            <button class="sci" onclick="pressSci('cos')">cos</button>
            <button class="sci" onclick="pressSci('tan')">tan</button>
            <button class="sci" onclick="pressSci('sqrt')">√</button>
            
            <button class="sci" onclick="pressSci('pow')">xʸ</button>
            <button class="sci" onclick="pressSci('pi')">π</button>
            <button class="sci" onclick="press('(')">(</button>
            <button class="sci" onclick="press(')')">)</button>

            <button class="clear" onclick="clearScreen()">C</button>
            <button class="sci" onclick="backspace()">⌫</button>
            <button class="op" onclick="press('/')">÷</button>
            <button class="op" onclick="press('*')">×</button>

            <button class="num" onclick="press('7')">7</button>
            <button class="num" onclick="press('8')">8</button>
            <button class="num" onclick="press('9')">9</button>
            <button class="op" onclick="press('-')">-</button>

            <button class="num" onclick="press('4')">4</button>
            <button class="num" onclick="press('5')">5</button>
            <button class="num" onclick="press('6')">6</button>
            <button class="op" onclick="press('+')">+</button>

            <button class="num" onclick="press('1')">1</button>
            <button class="num" onclick="press('2')">2</button>
            <button class="num" onclick="press('3')">3</button>
            <button class="op" style="grid-row: span 2; height: 100%;" onclick="calculate()">=</button>

            <button class="num" style="grid-column: span 2;" onclick="press('0')">0</button>
            <button class="num" onclick="press('.')">.</button>
        </div>
    </div>

    <div class="history-panel">
        <h4>Riwayat Hitungan</h4>
        <ul class="history-list" id="history-list">
            <li style="color: #888; text-align: center; padding-top: 20px;">Belum ada riwayat</li>
        </ul>
    </div>
</div>

<script>
    let currentInput = '';
    let memoryHistory = [];

    function press(val) {
        if (currentInput === '0' && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateScreen();
    }

    function pressSci(func) {
        if (func === 'sin') currentInput += 'Math.sin(';
        if (func === 'cos') currentInput += 'Math.cos(';
        if (func === 'tan') currentInput += 'Math.tan(';
        if (func === 'sqrt') currentInput += 'Math.sqrt(';
        if (func === 'pow') currentInput += '**';
        if (func === 'pi') currentInput += 'Math.PI';
        updateScreen();
    }

    function clearScreen() {
        currentInput = '';
        document.getElementById('display-history').innerText = '';
        updateScreen();
    }

    function backspace() {
        currentInput = currentInput.slice(0, -1);
        updateScreen();
    }

    function updateScreen() {
        document.getElementById('display-result').innerText = currentInput || '0';
    }

    function calculate() {
        try {
            let expression = currentInput;
            // Evaluasi ekspresi matematika dengan aman
            let result = eval(expression);
            
            if (result !== undefined) {
                document.getElementById('display-history').innerText = expression;
                document.getElementById('display-result').innerText = result;
                
                // Tambah ke riwayat
                addHistory(expression, result);
                currentInput = result.toString();
            }
        } catch (error) {
            document.getElementById('display-result').innerText = 'Error';
            currentInput = '';
        }
    }

    function addHistory(expr, res) {
        memoryHistory.unshift({ expr, res });
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        memoryHistory.forEach(item => {
            let li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `<div>${item.expr}</div><strong>= ${item.res}</strong>`;
            li.onclick = () => {
                currentInput = item.res.toString();
                updateScreen();
            };
            list.appendChild(li);
        });
    }

    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
        } else {
            body.setAttribute('data-theme', 'dark');
        }
    }
</script>
</body>
</html>
