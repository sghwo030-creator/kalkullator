<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Super Multi-Fitur Ultra Pro</title>
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-calc: #ffffff;
            --txt-main: #333333;
            --btn-num: #e9ecef;
            --btn-op: #fd7e14;
            --btn-sci: #6c757d;
            --btn-mem: #4a5568;
            --screen-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-calc: #1e1e1e;
            --txt-main: #ffffff;
            --btn-num: #2d2d2d;
            --btn-op: #f77f00;
            --btn-sci: #4a4a4a;
            --btn-mem: #2c3e50;
            --screen-bg: #0f0f0f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--txt-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .calculator {
            background-color: var(--bg-calc);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 1.3;
            min-width: 320px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-toggle, .paste-btn {
            background: none;
            border: 2px solid var(--txt-main);
            color: var(--txt-main);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .screen {
            background-color: var(--screen-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .screen .memory-indicator {
            position: absolute;
            left: 15px;
            top: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--btn-op);
            display: none;
        }

        .screen .history {
            font-size: 0.9rem;
            color: #888;
            min-height: 20px;
            overflow: hidden;
        }

        .screen .result {
            font-size: 2.2rem;
            font-weight: bold;
            overflow-x: auto;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px 10px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, filter 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .num { background-color: var(--btn-num); color: var(--txt-main); }
        .op { background-color: var(--btn-op); color: white; }
        .sci { background-color: var(--btn-sci); color: white; }
        .mem { background-color: var(--btn-mem); color: white; }
        .clear { background-color: #dc3545; color: white; }

        .history-panel {
            background-color: var(--bg-calc);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 0.9;
            min-width: 250px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-hist-btn {
            background: none;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .clear-hist-btn:hover {
            background-color: #dc3545;
            color: white;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            text-align: right;
        }

        .history-item:hover {
            background-color: var(--screen-bg);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Kalkulator -->
    <div class="calculator">
        <div class="header">
            <h3>Kalkulator Ultra Pro</h3>
            <div class="header-buttons">
                <button class="paste-btn" onclick="pasteFromClipboard()">📋 Paste</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
            </div>
        </div>
        <div class="screen">
            <div class="memory-indicator" id="mem-indicator">M</div>
            <div class="history" id="display-history"></div>
            <div class="result" id="display-result">0</div>
        </div>
        
        <div class="buttons">
            <!-- Baris Fitur Memori & Fitur Baru -->
            <button class="mem" onclick="handleMemory('MC')">MC</button>
            <button class="mem" onclick="handleMemory('MR')">MR</button>
            <button class="mem" onclick="handleMemory('M+')">M+</button>
            <button class="sci" onclick="pressSci('log')">log</button>
            <button class="sci" onclick="pressSci('ln')">ln</button>

            <!-- Baris Sains Tambahan -->
            <button class="sci" onclick="pressSci('sin')">sin</button>
            <button class="sci" onclick="pressSci('cos')">cos</button>
            <button class="sci" onclick="pressSci('tan')">tan</button>
            <button class="sci" onclick="pressSci('sqrt')">√</button>
            <button class="sci" onclick="pressSci('fact')">n!</button>
            
            <button class="sci" onclick="pressSci('pow')">xʸ</button>
            <button class="sci" onclick="pressSci('pi')">π</button>
            <button class="sci" onclick="press('(')">(</button>
            <button class="sci" onclick="press(')')">)</button>
            <button class="op" onclick="press('%')">%</button>

            <!-- Baris Standar Berubah Jadi 5 Kolom -->
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="sci" onclick="backspace()">⌫</button>
            <button class="num" onclick="press('7')">7</button>
            <button class="num" onclick="press('8')">8</button>
            <button class="op" onclick="press('/')">÷</button>

            <button class="num" onclick="press('9')">9</button>
            <button class="num" onclick="press('4')">4</button>
            <button class="num" onclick="press('5')">5</button>
            <button class="num" onclick="press('6')">6</button>
            <button class="op" onclick="press('*')">×</button>

            <button class="num" onclick="press('1')">1</button>
            <button class="num" onclick="press('2')">2</button>
            <button class="num" onclick="press('3')">3</button>
            <button class="num" onclick="press('0')">0</button>
            <button class="op" onclick="press('-')">-</button>

            <button class="num" style="grid-column: span 2;" onclick="press('.')">.</button>
            <button class="op" style="grid-column: span 3; font-size: 1.5rem;" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- Panel Riwayat -->
    <div class="history-panel">
        <div class="history-header">
            <h4>Riwayat Hitungan</h4>
            <button class="clear-hist-btn" onclick="clearHistory()">Hapus Semua</button>
        </div>
        <ul class="history-list" id="history-list">
            <li id="no-hist" style="color: #888; text-align: center; padding-top: 20px;">Belum ada riwayat</li>
        </ul>
    </div>
</div>

<script>
    let currentInput = '';
    let memoryHistory = [];
    let calculatorMemory = 0; // Tempat menyimpan nilai M+

    // Fungsi matematika custom agar eval() mengenali perintah sains
    const log = (x) => Math.log10(x);
    const ln = (x) => Math.log(x);
    const sin = (x) => Math.sin(x * Math.PI / 180); // Menggunakan derajat/degree
    const cos = (x) => Math.cos(x * Math.PI / 180);
    const tan = (x) => Math.tan(x * Math.PI / 180);
    const sqrt = (x) => Math.sqrt(x);
    const fact = (n) => {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
    };

    function press(val) {
        if (currentInput === '0' && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateScreen();
    }

    function pressSci(func) {
        if (func === 'sin') currentInput += 'sin(';
        if (func === 'cos') currentInput += 'cos(';
        if (func === 'tan') currentInput += 'tan(';
        if (func === 'sqrt') currentInput += 'sqrt(';
        if (func === 'log') currentInput += 'log(';
        if (func === 'ln') currentInput += 'ln(';
        if (func === 'fact') currentInput += 'fact(';
        if (func === 'pow') currentInput += '**';
        if (func === 'pi') currentInput += 'Math.PI';
        updateScreen();
    }

    function clearScreen() {
        currentInput = '';
        document.getElementById('display-history').innerText = '';
        updateScreen();
    }

    function backspace() {
        currentInput = currentInput.slice(0, -1);
        updateScreen();
    }

    function updateScreen() {
        document.getElementById('display-result').innerText = currentInput || '0';
    }

    function calculate() {
        try {
            let expression = currentInput;
            // Menghitung hasil dengan aman lewat fungsi kustom
            let result = eval(expression);
            
            if (result !== undefined) {
                // Pembulatan agar tidak muncul angka desimal kepanjangan (ex: 0.30000000004)
                if(result % 1 !== 0) result = parseFloat(result.toFixed(8));

                document.getElementById('display-history').innerText = expression;
                document.getElementById('display-result').innerText = result;
                
                addHistory(expression, result);
                currentInput = result.toString();
            }
        } catch (error) {
            document.getElementById('display-result').innerText = 'Error';
            currentInput = '';
        }
    }

    // MANAJEMEN FITUR MEMORI (MC, MR, M+)
    function handleMemory(action) {
        let currentVal = parseFloat(document.getElementById('display-result').innerText) || 0;
        
        if (action === 'M+') {
            calculatorMemory += currentVal;
            document.getElementById('mem-indicator').style.display = 'block';
        } else if (action === 'MR') {
            currentInput = calculatorMemory.toString();
            updateScreen();
        } else if (action === 'MC') {
            calculatorMemory = 0;
            document.getElementById('mem-indicator').style.display = 'none';
        }
    }

    // MANAJEMEN RIWAYAT
    function addHistory(expr, res) {
        memoryHistory.unshift({ expr, res });
        renderHistory();
    }

    function clearHistory() {
        memoryHistory = [];
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        if(memoryHistory.length === 0) {
            list.innerHTML = `<li id="no-hist" style="color: #888; text-align: center; padding-top: 20px;">Belum ada riwayat</li>`;
            return;
        }

        memoryHistory.forEach(item => {
            let li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `<div>${item.expr}</div><strong>= ${item.res}</strong>`;
            li.onclick = () => {
                currentInput = item.res.toString();
                updateScreen();
            };
            list.appendChild(li);
        });
    }

    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
        } else {
            body.setAttribute('data-theme', 'dark');
        }
    }

    // FITUR PASTE & KEYBOARD
    function handlePastedText(text) {
        let cleanText = text.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '.');
        if (currentInput === '0') {
            currentInput = cleanText;
        } else {
            currentInput += cleanText;
        }
        updateScreen();
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            handlePastedText(text);
        } catch (err) {
            alert('Gagal membaca clipboard. Berikan izin akses clipboard pada browsermu.');
        }
    }

    window.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        handlePastedText(text);
    });

    window.addEventListener('keydown', (e) => {
        const allowedKeys = '0123456789+-*/.()%';
        if (allowedKeys.includes(e.key)) {
            e.preventDefault();
            press(e.key);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            calculate();
        } else if (e.key === 'Backspace') {
            e.preventDefault();
            backspace();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            clearScreen();
        }
    });
</script>
</body>
</html>
